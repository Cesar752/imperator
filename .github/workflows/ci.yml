name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compile + tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de test
        # Con las versiones congeladas de constraints-test.txt: sin ellas cada
        # ejecución resolvía versiones distintas y una actualización podía romper
        # la suite sin tocar el proyecto.
        run: pip install -r requirements-test.txt -c constraints-test.txt

      - name: Lint (ruff)
        # Reglas en ruff.toml: sintaxis, nombres/imports sin usar y except ciego.
        # Al principio del job para que un error de este tipo se vea antes que
        # una suite de 620 tests.
        run: |
          pip install ruff==0.16.9
          python -m ruff check .

      - name: Compilar todo el árbol
        run: python -m compileall -q .

      - name: Tests (stdlib unittest)
        run: python -m unittest discover -s tests -v
        env:
          IMPERATOR_GUI_SMOKE: "1"
