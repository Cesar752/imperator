name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compile + tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de test
        run: pip install -r requirements-test.txt

      - name: Compilar todo el árbol
        run: python -m compileall -q .

      - name: Tests (stdlib unittest)
        run: python -m unittest discover -s tests -v
        env:
          IMPERATOR_GUI_SMOKE: "1"
